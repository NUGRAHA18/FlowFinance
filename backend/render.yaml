# Render Blueprint — deploy dari repo ini dengan Root Directory = "backend".
# Dashboard Render → New → Blueprint → pilih repo → Render membaca file ini.
services:
  - type: web
    name: flowfinance-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend

    # `prisma migrate deploy` dijalankan saat build, bukan saat start, supaya
    # deploy gagal lebih awal kalau migrasi bermasalah — bukan crash-loop.
    buildCommand: npm ci && npm run build
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Transaction pooler (port 6543) + ?pgbouncer=true
      - key: DATABASE_URL
        sync: false
      # Supabase Direct connection (port 5432) — dipakai prisma migrate deploy
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # URL produksi Vercel, mis. https://flowfinance.vercel.app
      # Boleh diisi beberapa origin dipisah koma.
      - key: FRONTEND_URL
        sync: false
      - key: DB_POOL_MAX
        value: "10"
